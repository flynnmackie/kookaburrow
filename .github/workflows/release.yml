# Builds the offline Windows installer (.msi and setup .exe) and the Debian/Ubuntu package (.deb), and attaches them to a GitHub release.
#   Release:  git tag v1.0.1 && git push origin v1.0.1
#   Test:     push to the ci-build branch, or Actions > Build installer > Run workflow (the files are kept as build artifacts, nothing is published)
name: Build installer
on:
  push:
    tags: ['v*']
    branches: ['ci-build']   # push to this branch to test the builds without publishing a release
  workflow_dispatch:
permissions:
  contents: write
jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci            # also builds the bundled WinRM engine (vendor/winrm-runtime)
      - name: Build the installer (signed when the signing secrets exist)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          KB_SIGN_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:SIGNING_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            node scripts/build-msi.js "--sign-pfx=$env:RUNNER_TEMP\sign.pfx"
          } else { node scripts/build-msi.js }
      - uses: actions/upload-artifact@v4
        with:
          name: Kookaburrow-msi
          path: |
            build/Kookaburrow-*-x64.msi
            build/Kookaburrow-Setup-*-x64.exe
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-deb.js
      - uses: actions/upload-artifact@v4
        with:
          name: Kookaburrow-deb
          path: build/kookaburrow_*.deb
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [msi, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Title and notes
        run: |
          echo "TITLE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then echo "NOTES=release-notes/${GITHUB_REF_NAME}.md" >> "$GITHUB_ENV"; else echo "NOTES=" >> "$GITHUB_ENV"; fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.TITLE }}
          body_path: ${{ env.NOTES }}
          generate_release_notes: ${{ env.NOTES == '' }}
          files: dist/*
