<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Kookaburrow</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root {
    --bg:#06070a; --panel:#0e1117; --panel2:#141922; --line:#1d222d; --line-hi:#2c3445;
    --text:#e7eaf0; --dim:#98a1b0; --faint:#6b7585; --blue:#00c8ff; --blue-d:#0b7fa3; --bad:#ef5b61;
    --f-ui:'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 var(--f-ui); display:flex; align-items:center; justify-content:center;
    background-image:radial-gradient(ellipse at 50% 35%, rgba(0,200,255,.07), transparent 60%); }
  .box { width:min(340px, calc(100vw - 32px)); text-align:center; }
  .box img { width:150px; height:auto; display:block; margin:0 auto 6px; }
  h1 { margin:0 0 2px; font:600 20px var(--f-ui); letter-spacing:.02em; }
  .tag { color:var(--dim); font-size:12.5px; margin-bottom:18px; }
  form { background:var(--panel); border:1px solid var(--line-hi); border-radius:6px; padding:16px; text-align:left; }
  label { display:block; font:600 10.5px var(--f-ui); letter-spacing:.05em; text-transform:uppercase; color:var(--faint); margin:0 0 4px; }
  input { width:100%; background:#090b10; color:var(--text); border:1px solid var(--line-hi); border-radius:4px; padding:7px 9px; font:14px var(--f-ui); outline:none; margin-bottom:12px; }
  input:hover { border-color:#3b4660; } input:focus { border-color:var(--blue); }
  button { width:100%; background:var(--blue); color:#00141c; border:1px solid var(--blue); border-radius:4px; padding:8px 10px; font:600 13.5px var(--f-ui); cursor:pointer; }
  button:hover:not(:disabled) { background:#35d6ff; } button:disabled { opacity:.6; cursor:default; }
  #msg { min-height:18px; margin-top:10px; color:var(--bad); font-size:12.5px; text-align:center; }
  .foot { margin-top:14px; color:var(--faint); font-size:11.5px; }
</style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="Kookaburrow">
    <h1>Kookaburrow</h1>
    <div class="tag">Sign in to continue</div>
    <form id="f" autocomplete="on">
      <label for="u">Username</label>
      <input id="u" name="username" type="text" autocomplete="username" spellcheck="false" autofocus>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password">
      <button id="go" type="submit">Sign in</button>
      <div id="msg" role="alert"></div>
    </form>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  // Already signed in? Go straight to the app.
  fetch('/api/auth/me').then((r) => { if (r.ok) location.replace('/#home/home'); }).catch(() => {});
  $('f').onsubmit = async (e) => {
    e.preventDefault();
    if (!$('u').value.trim() || !$('p').value) { $('msg').textContent = 'Enter your username and password'; return; }
    $('go').disabled = true; $('go').textContent = 'Signing in…'; $('msg').textContent = '';
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('u').value.trim(), password: $('p').value }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'Sign-in failed');
      location.replace('/#home/home'); // new sign-ins land on the home page
    } catch (err) {
      $('msg').textContent = err.message;
      $('p').value = ''; $('p').focus();
      $('go').disabled = false; $('go').textContent = 'Sign in';
    }
  };
</script>
</body>
</html>
