<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Kookaburrow</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 var(--f-ui); display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased; }
  .box { width:min(360px, calc(100vw - 32px)); text-align:center; }
  .box img { width:128px; height:auto; display:block; margin:0 auto 14px; }
  h1 { margin:0 0 4px; font:600 22px var(--f-ui); letter-spacing:-.01em; }
  .tag { color:var(--dim); font-size:13px; margin-bottom:22px; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:20px; text-align:left; }
  label { display:block; font:500 12px var(--f-ui); color:var(--dim); margin:0 0 5px; }
  input { width:100%; background:var(--inset); color:var(--text); border:1px solid var(--line-hi); border-radius:var(--r-m); padding:8px 10px; font:14px var(--f-ui); outline:none; margin-bottom:14px; transition:border-color var(--ease), box-shadow var(--ease); }
  input:hover { border-color:#41506a; } input:focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); }
  button { width:100%; background:var(--accent-fill); color:var(--on-accent); border:1px solid var(--accent-fill); border-radius:var(--r-m); padding:9px 10px; font:500 13.5px var(--f-ui); cursor:pointer; transition:background var(--ease); }
  button:hover:not(:disabled) { background:var(--accent-hover); border-color:var(--accent-hover); } button:disabled { opacity:.6; cursor:default; }
  button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  #msg { min-height:18px; margin-top:12px; color:var(--bad); font-size:12.5px; text-align:center; }
  .foot { margin-top:16px; color:var(--faint); font-size:11.5px; }
</style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="Kookaburrow">
    <h1>Kookaburrow</h1>
    <div class="tag">Sign in to continue</div>
    <form id="f" autocomplete="on">
      <label for="u">Username</label>
      <input id="u" name="username" type="text" autocomplete="username" spellcheck="false" autofocus>
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password">
      <button id="go" type="submit">Sign in</button>
      <div id="msg" role="alert"></div>
    </form>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  // Already signed in? Go straight to the app.
  fetch('/api/auth/me').then((r) => { if (r.ok) location.replace('/#home/home'); }).catch(() => {});
  $('f').onsubmit = async (e) => {
    e.preventDefault();
    if (!$('u').value.trim() || !$('p').value) { $('msg').textContent = 'Enter your username and password'; return; }
    $('go').disabled = true; $('go').textContent = 'Signing in…'; $('msg').textContent = '';
    try {
      const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('u').value.trim(), password: $('p').value }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'Sign-in failed');
      location.replace('/#home/home'); // new sign-ins land on the home page
    } catch (err) {
      $('msg').textContent = err.message;
      $('p').value = ''; $('p').focus();
      $('go').disabled = false; $('go').textContent = 'Sign in';
    }
  };
</script>
</body>
</html>
